spring.application.name=bth5-report-service
server.port=${SERVER_PORT:8083}

# Dedicated Report Service database: never access BTH3_PRODUCT or BTH4_ORDER directly.
spring.datasource.url=${REPORT_DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:BTH5_REPORT}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

product.service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
order.service.base-url=${ORDER_SERVICE_URL:http://localhost:8082}

auth.service.base-url=${AUTH_SERVICE_URL:http://localhost:8080}
